apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "1.8.x"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    defaultSettings:
      defaultDataLocality: disabled
      replicaCount: 3
      iscsiadmPath: /usr/local/sbin/iscsiadm
    persistence:
      defaultClassReplicaCount: 3
    csi:
      kubeletRootDir: /var/lib/kubelet
      attacherReplicaCount: 3
      provisionerReplicaCount: 3
      resizerReplicaCount: 3
      snapshotterReplicaCount: 3
